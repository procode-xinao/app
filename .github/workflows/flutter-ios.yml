# 仅构建 iOS（macOS runner，无签名）

name: Flutter iOS Build

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 服务根 URL（build_with_site --service=）
        required: true
      app_code:
        description: 可选租户 code（默认 code）
        required: false
        default: code

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  ios-nosign:
    name: iOS (no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter (Generated.xcconfig for CocoaPods)
        run: flutter pub get

      - name: Install SVG rasterizer (site icons may be SVG)
        run: brew install librsvg

      - name: CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        run: |
          dart run tool/build_with_site.dart \
            --service="${{ github.event.inputs.service_url }}" \
            --code="${{ github.event.inputs.app_code }}" \
            build ios --release --no-codesign

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
