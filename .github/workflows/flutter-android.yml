# 仅构建 Android APK（Linux runner）

name: Flutter Android Build

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 站点根 URL（build_with_site，建议含尾斜杠）
        required: true
      external_server_url:
        description: 外网 API 基址（APP_EXTERNAL_SERVER_URL）
        required: true
      internal_server_url:
        description: 内网 API 基址（APP_INTERNAL_SERVER_URL）
        required: true
      app_code:
        description: 租户 code（APP_CODE）
        required: true

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install SVG rasterizer (site icons may be SVG)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build APK
        run: |
          dart run tool/build_with_site.dart \
            --service="${{ github.event.inputs.service_url }}" \
            --external-server="${{ github.event.inputs.external_server_url }}" \
            --internal-server="${{ github.event.inputs.internal_server_url }}" \
            --code="${{ github.event.inputs.app_code }}" \
            build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
