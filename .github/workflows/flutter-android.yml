# 仅构建 Android APK（Linux runner）

name: Flutter Android Build

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 服务根 URL（build_with_site --service=）
        required: true
      app_code:
        description: 可选租户 code（默认 code，/build 时也可从 /v1/site 读取）
        required: false
        default: code

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install SVG rasterizer (site icons may be SVG)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build APK
        run: |
          dart run tool/build_with_site.dart \
            --service="${{ github.event.inputs.service_url }}" \
            --code="${{ github.event.inputs.app_code }}" \
            build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
