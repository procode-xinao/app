# 公开仓库 + GitHub 托管 runner：免费构建 Android APK / iOS（无签名）
# 手动运行：Actions → Flutter Build → Run workflow（须填写全部 4 个环境参数）

name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      service_url:
        description: 站点根 URL（build_with_site，建议含尾斜杠）
        required: true
      external_server_url:
        description: 外网 API 基址（APP_EXTERNAL_SERVER_URL）
        required: true
      internal_server_url:
        description: 内网 API 基址（APP_INTERNAL_SERVER_URL）
        required: true
      app_code:
        description: 租户 code（APP_CODE）
        required: true

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install SVG rasterizer (site icons may be SVG)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build APK (site branding + release)
        run: |
          dart run tool/build_with_site.dart \
            --service="${{ github.event.inputs.service_url }}" \
            --external-server="${{ github.event.inputs.external_server_url }}" \
            --internal-server="${{ github.event.inputs.internal_server_url }}" \
            --code="${{ github.event.inputs.app_code }}" \
            build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-nosign:
    name: iOS (no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter (Generated.xcconfig for CocoaPods)
        run: flutter pub get

      - name: Install SVG rasterizer (site icons may be SVG)
        run: brew install librsvg

      - name: CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (site branding + release, no codesign)
        run: |
          dart run tool/build_with_site.dart \
            --service="${{ github.event.inputs.service_url }}" \
            --external-server="${{ github.event.inputs.external_server_url }}" \
            --internal-server="${{ github.event.inputs.internal_server_url }}" \
            --code="${{ github.event.inputs.app_code }}" \
            build ios --release --no-codesign

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
